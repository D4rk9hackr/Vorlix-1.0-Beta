[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vorlix"
version = "1.0.0-beta.4"
description = "The AI Hand — Control Layer Engine"
requires-python = ">=3.10"
license = { text = "GPL-3.0-only" }

[project.scripts]
vorlix = "vorlix_cli.main:main"

[project.optional-dependencies]
cv = ["opencv-contrib-python>=4.8", "pyautogui>=0.9.54", "mss>=9.0.1", "numpy>=1.24"]
